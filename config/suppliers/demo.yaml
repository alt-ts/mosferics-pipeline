# config/suppliers/demo.yaml
#
# A fictional supplier for the Docker demo. Its files, in sample_data/demo/,
# are SYNTHETIC: invented brand, names, SKUs and prices, generated by
# sample_data/make_demo_files.py. Nothing here is real supplier data.
#
# It uses the same two-file layout as the pilot supplier (config/suppliers/
# artis.yaml) with its own column names, which is the point it makes: a new
# supplier is a config file, not a code change. Each kind of row the pipeline
# has to handle appears at least once: a capacity range with a lined twin, a
# sparse size-and-colour matrix, a two-tone colour, a capacity the name
# contradicts, two SKUs nothing tells apart, a safety contradiction, a pack size
# the files disagree on, and a category left for manual review.

supplier:
  code: demo
  name: Demo Supplier (synthetic data)
  currency: GBP
  availability_source: unknown

files:
  price:
    pattern: "Demo_Price_File_*.csv"
    format: csv
    encoding: utf-8
    key: SKU
    required_columns: [SKU, Product, Brand, Pack Size, List Price, Unit Price, Pack Price]
  product:
    pattern: "Demo_Product_Data_*.csv"
    format: csv
    encoding: utf-8
    key: Code
    required_columns: [Code, Description, Brand, Category, Type, Style, Range, Material, Finish,
                       Capacity (cl), Capacity (ml), Box Qty, Sales Pack, Barcode,
                       Dishwasher Safe, Handwash Only, Microwave Safe, Diameter (cm), Weight (kg)]

key_format: '^\d{2}-\d{2}-\d{3}$'

join:
  primary: price
  secondary: product
  duplicate_key: raise
  primary_without_secondary: load
  secondary_without_primary: review

product:
  supplier_sku: price.SKU
  name_raw: [product.Description, price.Product]
  brand: [product.Brand, price.Brand]
  supplier_category_raw:
    columns: [product.Category, product.Type, product.Style]
    separator: " > "
    blank: "-"

classification_method: mapped_column
base_unit: each

name_clean:
  collapse_whitespace: true

offer:
  cost_ex_vat: price.Pack Price
  base_units_per_pack: price.Pack Size
  pack_description: product.Sales Pack
  checks:
    - name: pack_price_is_unit_price_times_pack
      expr: "Pack Price == Unit Price * Pack Size"
      tolerance: 0.01
      on_fail: raise
    - name: pack_size_agrees_with_product_file
      compare: [price.Pack Size, product.Box Qty]
      on_fail: review
      on_blank: ignore
  list_price: price.List Price

capacity:
  brim:
    source: product.Capacity (cl)
    unit: cl
    zero_is_blank: true
    cross_check:
      source: product.Capacity (ml)
      unit: ml
      tolerance_ml: 5
      on_fail: review
  line_mark:
    source: name_raw
    block: '\((?P<body>[^)]*@[^)]*)\)'
    strip_from_body: []
    segment: '(?P<kind>CE ?Brim|CE|Lined)@(?P<values>\d+(?:\.\d+)?(?:/\d+)?(?:,\s?\d+(?:\.\d+)?(?:/\d+)?)*)(?P<unit>ml|pt)\.?'
    segment_separator: ','
    kinds: {CE: line, Lined: line, CE Brim: brim, CEBrim: brim}
    units: {ml: ml, pt: imperial_pint}
    value_aliases:
      imperial_pint: {"0.33": "1/3", "0.66": "2/3"}
    multiple_values: keep_all
    on_unparsed: review

size:
  source: name_raw
  pattern: '(?P<a>\d+(?:\.\d+)?)(?:x(?P<b>\d+(?:\.\d+)?))?(?:x(?P<c>\d+(?:\.\d+)?))?\s?cm'
  unit: cm
  take: first

vocabulary:
  material:
    source: product.Material
    status: pending_review           # hard rule 3: materials are never auto-verified
    treat_as_blank: ["Other"]
  finish:
    source: product.Finish
  colour:
    source: name_raw
    method: alias_in_name
    status: proposed
    multiple_matches: review
    ignore_phrases: [Red Wine, White Wine]

safety:
  status: pending_review             # hard rule 3: never auto-verified
  true_value: "Y"
  blank: omit
  flags:
    dishwasher_safe: product.Dishwasher Safe
    handwash_only: product.Handwash Only
    microwave_safe: product.Microwave Safe
  contradictions:
    - flags: [dishwasher_safe, handwash_only]
      on_fail: review

specs:
  range: {source: product.Range}
  list_price: {source: price.List Price, type: decimal}
  diameter_cm: {source: product.Diameter (cm), type: decimal, zero_is_blank: true}
  weight_kg: {source: product.Weight (kg), type: decimal, zero_is_blank: true}

barcode:
  source: product.Barcode
  store_as: specs.supplier_barcode
  use_as_match_key: false
  validate: gtin_check_digit
  on_invalid: keep_raw

grouping:
  key: [brand, supplier_category_raw, specs.range, name_stem]
  strip_from_name:
    - '\[[^\]]*\]'
    - '\b\d+(?:\.\d+)?(?:x\d+(?:\.\d+)?)*\s?(?:cl|ml|ltr|lt|cm|pt)\b\.?'
  size_words: [Small, Medium, Large]

variant_axes:
  capacity:
    value: capacity.brim
    qualifier: capacity.line_mark
    name_check:
      pattern: '(?<![\d.])(?P<value>\d+(?:\.\d+)?)\s?(?P<unit>cl|ml|ltr|lt)\b'
      units: {cl: cl, ml: ml, ltr: l, lt: l}
      tolerance_pct: 10
      accept: {}
  size:
    value: size
  colour:
    value: vocabulary.colour
    absent_in_group:
      value: clear
      materials: [glass, crystal, polycarbonate]
