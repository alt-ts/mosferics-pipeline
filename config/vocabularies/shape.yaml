  aliases:
    - "Fluted"
    - "Ribbed"

# --- Glassware bowl forms ---

coupe:
  display: "Coupe"
  aliases:
    - "Coupe"

tulip:
  display: "Tulip"
  aliases:
    - "Tulip"

balloon:
  display: "Balloon"
  aliases:
    - "Balloon"          # large round bowl — gin/cognac glassware

flute:
  display: "Flute"
  aliases:
    - "Flute"            # tall narrow bowl — champagne/sparkling glassware

stemmed:
  display: "Stemmed"
  aliases:
    - "Stemmed"
    - "Stemware"
