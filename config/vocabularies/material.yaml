    - "MS"             # mild steel
    - "Mild Steel"

galvanised_steel:
  display: "Galvanised Steel"
  aliases:
    - "Galvanised Steel"
    - "Galvanized Steel"
    - "Galvanised Tin"

cast_iron:
  display: "Cast Iron"
  aliases:
    - "Cast Iron"

iron:
  display: "Iron"
  aliases:
    - "Iron"
    - "Black Iron"

brass:
  display: "Brass"
  aliases:
    - "Brass"
    - "Brass Plating"
    - "Brass Plated"

copper:
  display: "Copper"
  aliases:
    - "Copper"
    - "Copper Plating"

zinc:
  display: "Zinc"
  aliases:
    - "Zinc"
    - "Zinc Alloy"

# ---------------------------------------------------------------------------
# Ceramics & stone
# ---------------------------------------------------------------------------

porcelain:
  display: "Porcelain"
  aliases:
    - "Porcelain"
    - "China"           # vitrified white-ware grades collapse into porcelain, per the
    - "Fine China"      # "grades collapse" convention (cf. stainless steel grades).
    - "Vitrified China" # Bone china is the one exception — see `bone_china` below.

bone_china:
  display: "Bone China"
  # Distinct canonical: bone china is a materially different body (bone-ash content)
  # and is marketed on that basis. Only "Bone China" maps here; all other china
  # grades fall into `porcelain`.
  aliases:
    - "Bone China"

stoneware:
  display: "Stoneware"
  aliases:
    - "Stoneware"

ceramic:
  display: "Ceramic"
  aliases:
    - "Ceramic"

terracotta:
  display: "Terracotta"
  aliases:
    - "Terracotta"

slate:
  display: "Slate"
  aliases:
    - "Slate"

marble:
  display: "Marble"
  aliases:
    - "Marble"

terrazzo:
  display: "Terrazzo"
  aliases:
    - "Terrazzo"

stone:
  display: "Stone"
  aliases:
