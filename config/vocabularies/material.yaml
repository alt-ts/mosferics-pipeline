# ---------------------------------------------------------------------------
# Glass
# ---------------------------------------------------------------------------

glass:
  display: "Glass"
  aliases:
    - "Glass"
    - "Soda Lime Glass"
    - "Soda Lime"
    - "SodaLime"
    - "Borosilicate"
    - "Borosilicate Glass"
    - "High White Glass"
    - "Tempered Glass"
    - "Fully Tempered Glass"
    - "Foam Glass"
    - "Fibreglass"
    - "Fiberglass"

crystalline:
  display: "Crystalline Glass"
  # Crystalline glass (lead-free "crystalline") — distinct from both generic glass
  # and true crystal. Kept separate from `crystal` deliberately.
  aliases:
    - "Crystalline Glass"
    - "Crystalline"

crystal:
  display: "Crystal"
  # STRICT: only ever assigned when a supplier explicitly states "crystal". Never
  # inferred from "glass", "crystalline", "clear" or any near-term — those are their
  # own canonicals. If the supplier does not say crystal, it is not crystal.
  aliases:
    - "Crystal"
    - "Crystal Glass"
    - "Lead Crystal"

