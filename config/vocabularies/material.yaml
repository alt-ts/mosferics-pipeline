# config/vocabularies/material.yaml
#
# Controlled vocabulary for Material (Stage 6 deliverable).
#
# Canonical keys are snake_case internal identifiers. `display` is the term we
# publish. `aliases` are every supplier spelling that normalises to this canonical.
#
# Conventions
# -----------
# * BASE MATERIALS ONLY. Suppliers publish compound values, e.g. Nevilles writes
#   "Brass,Stainless Steel" or "Acacia Wood-A/B Grade,Iron,Plywood". Ingest splits
#   these on comma/semicolon into atomic tokens, then aliases each token to a
#   canonical here. A product can therefore carry several material tags.
# * GRADES COLLAPSE. Stainless steel grades (201, 304, 18/10, Grade 5, X50CrMoV15…)
#   all map to `stainless_steel`. The grade is not a separate published material;
#   retain the raw string on the supplier row if grade ever needs surfacing.
# * COATINGS / PLATINGS route to the FINISH vocabulary, not here — chrome plating,
#   powder coating, PVD, teflon/non-stick, anodising are finishes. The exceptions
#   are copper and brass "plating", kept here because they denote the visible
#   material a customer buys on; and `enamel`, which is enamelware's defining body.
# * Unmapped supplier values go to the NocoDB "Unmapped vocabulary" review view,
#   get aliased once, and are never seen again.
#
# Aliases are matched case-insensitively after trimming whitespace.
# Sources: Nevilles "Product Material" column; existing Shopify export material
# metafields (products_export_1.csv). Uropa/Bronze has no material column —
# equipment materials are extracted from descriptions at ingest, not aliased here.

# ---------------------------------------------------------------------------
# Metals
# ---------------------------------------------------------------------------

stainless_steel:
  display: "Stainless Steel"
  aliases:
    - "Stainless Steel"
    - "S/Steel"
    - "Stainless"
    - "Stainless Stl"
    - "SS"
    - "18/10"
    - "18/8"
    - "18/0"
    - "13/0"
    - "Stainless Steel 18-10"
    - "Stainless Steel 18-0"
    - "Stainless Steel-18/10"
    - "Stainless Steel-18/8"
    - "Stainless Steel-18/0"
    - "Stainless Steel-13/0"
    - "Stainless Steel-200"
    - "Stainless Steel-201"
    - "Stainless Steel-202"
    - "Stainless Steel-301"
    - "Stainless Steel-304"
    - "Stainless Steel-410"
    - "Stainless Steel-420"
    - "Stainless Steel-430"
    - "Stainless Steel-443"
    - "Stainless Steel-2CR13"
    - "Stainless Steel-3CR13"
    - "Stainless Steel-Grade 5"
    - "Stainless Steel-Grade 7"
    - "Stainless Steel-X50CrMoV15"
    - "Stainless Steel-5Cr15MoV"
    - "Molybdenum Stainless Steel"
    - "S/S"
    - "201 stainless steel"
    - "200 series stainless steel"
    - "200 series steel"          # Beaumont shorthand for 200-series stainless
    - "200 series non-magnetic S/S"
    - "304 stainless steel"
    - "304 series stainless steel"
    - "SS 304"
    - "SS 201"
    - "SS 430"
    - "430 stainless steel"
    - "430 steel"                 # 430 is a stainless grade
    - "AISI 430 (18/0)"
    - "420 stainless steel"
    - "2CR13"

aluminium:
  display: "Aluminium"
  aliases:
    - "Aluminium"
    - "Aluminum"
    - "Aluminium Alloy"
    - "Anodised Cast Aluminium"

carbon_steel:
  display: "Carbon Steel"
  aliases:
    - "Carbon Steel"

steel:
  display: "Steel"
  aliases:
    - "Steel"
    - "Steel-DC04"
